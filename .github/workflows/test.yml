name: Smoke test
on:
  pull_request:
  push:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint .

      - name: Template default
        run: helm template test .

      - name: Install CRD chart
        run: |
          helm pull oci://ghcr.io/bacluc-agent/rabbitmq-crd-chart/rabbitmq-crd --version 0.0.1 --untar --destination /tmp
          helm install crd /tmp/rabbitmq-crd --wait --timeout 5m --create-namespace --namespace rabbitmq-system

      - name: Install prometheus-operator CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.75.2/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
          kubectl apply -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.75.2/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml

      - name: Install chart
        run: helm install test . --timeout 10m --create-namespace --namespace rabbitmq --set prober.enabled=true

      - name: Assert RabbitmqCluster and prober
        run: |
          kubectl get rabbitmqcluster rabbitmq -n rabbitmq
          kubectl get deployment rabbitmq-prober -n rabbitmq

      - name: Uninstall chart
        run: helm uninstall test -n rabbitmq --wait

      - name: Assert CRDs retained
        run: |
          kubectl get crd rabbitmqclusters.rabbitmq.com
          kubectl get crd queues.rabbitmq.com