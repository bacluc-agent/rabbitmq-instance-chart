name: Publish Helm Chart
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  HELM_VERSION: 4.1.0
  HELM_IMAGE: ghcr.io/appuio/helm-v4

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup helm
        run: |
          mkdir -p ~/.config/helm/registry/
          echo "{}" > ~/.config/helm/registry/config.json
      - name: Derive chart version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep '^version:' Chart.yaml | awk '{print $2}')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Package Helm chart
        run: scripts/helm-docker.sh package . --version "$VERSION"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | scripts/helm-docker.sh registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Login to GHCR (docker)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute prober image tags
        id: prober-tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/prober"
          TAGS="$IMAGE:$VERSION"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: Build and push prober image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.prober-tags.outputs.tags }}
      - name: Push Helm chart
        run: scripts/helm-docker.sh push ./*.tgz oci://ghcr.io/${{ github.repository }}
