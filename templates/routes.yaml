{{- if and .Values.rabbitmq.enabled .Values.rabbitmq.tls.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: amqps
  namespace: {{ .Release.Namespace }}
spec:
  host: {{ .Values.rabbitmq.tls.dnsNames.amqps }}
  to:
    kind: Service
    name: {{ .Values.rabbitmq.name }}
  port:
    targetPort: amqps
  tls:
    termination: passthrough
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: management
  namespace: {{ .Release.Namespace }}
spec:
  host: {{ .Values.rabbitmq.tls.dnsNames.management }}
  to:
    kind: Service
    name: {{ .Values.rabbitmq.name }}
  port:
    targetPort: management-tls
  tls:
    termination: passthrough
{{- end }}